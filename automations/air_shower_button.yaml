# Home Assistant automation: SONOFF SNZB-01P Zigbee button -> air shower fans.
# Lives in automations.yaml on homepi (UI-managed file); this is the git copy.
# The button is physically in the house, so no home-Wi-Fi gate (unlike script.air_shower).
# Mode restart: any press aborts a run in progress.
# Button commands (verified 2026-10-19): single = toggle, double = on, long = off.
# Long press is deliberately unused: holding ~5 s puts the button into pairing mode.

- id: air_shower_button
  alias: Air Shower Button
  description: "SNZB-01P: single = profile (3 s blip, 1 min wait, 5 min fans); double = toggle fans now (off cancels any run, on stays on until toggled)."
  mode: restart
  triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "cc:36:bb:ff:fe:01:75:93"
  actions:
    - choose:
        - conditions: "{{ trigger.event.data.command == 'toggle' }}"
          sequence:
            # 3 s blip = audible confirmation that the cycle has started.
            - action: switch.turn_on
              target: { entity_id: switch.air_shower_fans }
            - delay: { seconds: 3 }
            - action: switch.turn_off
              target: { entity_id: switch.air_shower_fans }
            - delay: { minutes: 1 }
            - action: switch.turn_on
              target: { entity_id: switch.air_shower_fans }
            - delay: { minutes: 5 }
            - action: switch.turn_off
              target: { entity_id: switch.air_shower_fans }
        - conditions: "{{ trigger.event.data.command == 'on' }}"
          sequence:
            - if:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: switch.air_shower_fans
                      state: "on"
                    - condition: state
                      entity_id: script.air_shower
                      state: "on"
              then:
                - action: script.air_shower_cancel
              else:
                - action: switch.turn_on
                  target: { entity_id: switch.air_shower_fans }
