# Home Assistant Script to Cancel Air Shower Fans
# Turns the fans off, then stops a running button profile so it cannot turn them back on.
# Off is always safe, so this is the one air-shower action left callable remotely.
# Do NOT call it from automation.air_shower_button: it stops that automation (its caller).

air_shower_cancel:
  alias: "Cancel Air Shower"
  description: "Stop any running air shower profile and turn fans off immediately."
  mode: restart
  icon: mdi:fan-off
  sequence:
    - service: switch.turn_off
      target:
        entity_id: switch.air_shower_fans
    - service: automation.turn_off
      target:
        entity_id: automation.air_shower_button
      data:
        stop_actions: true
    - service: automation.turn_on
      target:
        entity_id: automation.air_shower_button
