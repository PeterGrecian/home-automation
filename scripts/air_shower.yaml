# Home Assistant Script for Air Shower Fans
# Execution: runs natively on homepi inside Home Assistant.
# Mode: restart (re-triggering resets the cycle safely).
# Condition: user must be on the LAN (Wi-Fi SSID 'Grecian2SeymourGdns' or person.peter_grecian 'home').

air_shower:
  alias: "Air Shower Fans Profile"
  description: "Standard air shower profile: wait delay (default 1m), run fans (default 5m), then turn off. Requires user to be on home LAN/home."
  mode: restart
  icon: mdi:fan
  sequence:
    - condition: template
      value_template: >-
        {{ is_state('sensor.pixel_6a_wifi_connection', 'Grecian2SeymourGdns')
           if states('sensor.pixel_6a_wifi_connection') not in ['unavailable', 'unknown', 'none']
           else is_state('person.peter_grecian', 'home') }}
    - delay:
        minutes: 1
    - service: switch.turn_on
      target:
        entity_id: switch.air_shower_fans
    - delay:
        minutes: 5
    - service: switch.turn_off
      target:
        entity_id: switch.air_shower_fans
