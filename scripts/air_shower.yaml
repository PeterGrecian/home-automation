# Home Assistant Script for Air Shower Fans
# Execution: runs natively on homepi inside Home Assistant.
# Mode: restart (re-triggering resets the cycle safely).
# Condition: user must be on the home LAN Wi-Fi (BSSID matching eero / Comtrend APs).

air_shower:
  alias: "Air Shower Fans Profile"
  description: "Standard air shower profile: 3 s fan blip, wait delay (default 1m), run fans (default 5m), then turn off. Requires phone on home Wi-Fi BSSID / LAN."
  mode: restart
  icon: mdi:fan
  sequence:
    - condition: template
      value_template: >-
        {% set bssid = states('sensor.pixel_6a_wi_fi_bssid') | lower %}
        {% set known = [
          '74:b6:b6:e8:af:c6', '74:b6:b6:e8:af:c5',
          '74:b6:b6:e8:25:86', '74:b6:b6:e8:25:85',
          '1c:64:99:0b:54:34', '1c:64:99:0b:54:30'
        ] %}
        {% if bssid in known or bssid.startswith('74:b6:b6') or bssid.startswith('1c:64:99') %}
          true
        {% elif bssid in ['unknown', 'unavailable', 'none', ''] %}
          {{ is_state('person.peter_grecian', 'home') }}
        {% else %}
          false
        {% endif %}
    # 3 s blip = audible confirmation that the profile has started.
    - service: switch.turn_on
      target:
        entity_id: switch.air_shower_fans
    - delay:
        seconds: 3
    - service: switch.turn_off
      target:
        entity_id: switch.air_shower_fans
    - delay:
        minutes: 1
    - service: switch.turn_on
      target:
        entity_id: switch.air_shower_fans
    - delay:
        minutes: 5
    - service: switch.turn_off
      target:
        entity_id: switch.air_shower_fans
